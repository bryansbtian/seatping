name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatping_ci_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seatping_ci_app
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/seatping_ci_app
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seatping_test
      JWT_SECRET: ci-placeholder-jwt-secret
      CRON_SECRET: ci-placeholder-cron-secret
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD_HASH: $2b$12$ciplaceholderciplaceholderciplaceholderciplaceholderci
      EMAIL_PASSWORD: ci-placeholder
      CLIENT_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create the Test Database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE seatping_test;'

      - name: Apply Prisma Migrations to the Test Database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End to End
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatping_e2e_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seatping_e2e_app
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/seatping_e2e_app
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seatping_e2e_test
      JWT_SECRET: ci-e2e-jwt-secret
      CRON_SECRET: ci-e2e-cron-secret
      ADMIN_USERNAME: ci-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create the Test Database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE seatping_e2e_test;'

      - name: Apply Prisma Migrations to the Test Database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run Playwright End to End Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
