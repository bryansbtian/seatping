name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ci-placeholder-jwt-secret
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD_HASH: $2b$12$ciplaceholderciplaceholderciplaceholderciplaceholderci
      EMAIL_PASSWORD: ci-placeholder
      CLIENT_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: mongodb://localhost:27017/seatping_test?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-test-jwt-secret
      CRON_SECRET: ci-test-cron-secret
      ADMIN_USERNAME: ci-admin
      CLIENT_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialise MongoDB Replica Set
        run: |
          docker exec "$(docker ps -q --filter ancestor=mongo:7)" mongosh --quiet --eval '
            try { rs.status() } catch (e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })
            }'
          for i in $(seq 1 30); do
            state=$(docker exec "$(docker ps -q --filter ancestor=mongo:7)" mongosh --quiet --eval 'try { rs.status().members[0].stateStr } catch (e) { "" }')
            if [ "$state" = "PRIMARY" ]; then
              echo "replica set ready"
              exit 0
            fi
            sleep 2
          done
          echo "replica set did not reach PRIMARY"
          exit 1

      - name: Push Prisma Schema to the Test Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: End to End
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: mongodb://localhost:27017/seatping_e2e_test?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-e2e-jwt-secret
      CRON_SECRET: ci-e2e-cron-secret
      ADMIN_USERNAME: ci-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialise MongoDB Replica Set
        run: |
          docker exec "$(docker ps -q --filter ancestor=mongo:7)" mongosh --quiet --eval '
            try { rs.status() } catch (e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })
            }'
          for i in $(seq 1 30); do
            state=$(docker exec "$(docker ps -q --filter ancestor=mongo:7)" mongosh --quiet --eval 'try { rs.status().members[0].stateStr } catch (e) { "" }')
            if [ "$state" = "PRIMARY" ]; then
              echo "replica set ready"
              exit 0
            fi
            sleep 2
          done
          echo "replica set did not reach PRIMARY"
          exit 1

      - name: Push Prisma Schema to the Test Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run Playwright End to End Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
