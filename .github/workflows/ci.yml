name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ci-placeholder-jwt-secret
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD_HASH: $2b$12$ciplaceholderciplaceholderciplaceholderciplaceholderci
      EMAIL_PASSWORD: ci-placeholder
      CLIENT_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
