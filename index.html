<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="format-detection"
      content="telephone=no, email=no, address=no, date=no, url=no"
    />
    <!--
      SEO block. These are the CUSTOMER-side defaults, used for "/" and the
      static SPA fallback. On business routes the server swaps everything
      between the markers below for business metadata before the HTML is sent,
      so crawlers (WhatsApp, etc.) see the correct preview w
    -->
    <!-- SEO:START -->
    <title>SeatPing | Find Restaurants, Book Tables, and Join Queues</title>
    <meta
      name="description"
      content="Discover restaurants, check availability, book tables, and join queues with SeatPing."
    />
    <meta name="author" content="SeatPing" />
    <meta
      property="og:title"
      content="SeatPing | Find Restaurants, Book Tables, and Join Queues"
    />
    <meta
      property="og:description"
      content="Discover restaurants, check availability, book tables, and join queues with SeatPing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SeatPing" />
    <meta property="og:url" content="https://www.seatping.biz/" />
    <meta
      property="og:image"
      content="https://www.seatping.biz/display2.jpeg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SeatPing | Find Restaurants, Book Tables, and Join Queues"
    />
    <meta
      name="twitter:description"
      content="Discover restaurants, check availability, book tables, and join queues with SeatPing."
    />
    <meta
      name="twitter:image"
      content="https://www.seatping.biz/display2.jpeg"
    />
    <link rel="canonical" href="https://www.seatping.biz/" />
    <!-- SEO:END -->

    <!--
      Explicit favicon declaration. Without these, crawlers fall back to
      guessing /favicon.ico and are slow to notice icon changes. The ?v=
      query string is a cache buster: bump it whenever the icon is replaced
      so browsers and Google re-fetch instead of serving a stale icon.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/logo_nobg.png" />

    <!--
      Google Analytics (GA4). The measurement ID is injected from the
      VITE_GA_MEASUREMENT_ID env var at build time. When the var is unset the
      placeholder stays literal and gtag receives a no-op config, so analytics
      is a graceful no-op in local dev / preview without the var. We set
      send_page_view: false because page views are sent manually from
      AnalyticsRouteTracker on each React Router navigation, which avoids
      double-counting the initial load in a single-page app.
    -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SeatPing",
        "url": "https://www.seatping.biz/",
        "description": "Discover restaurants, check availability, book tables, and join queues with SeatPing.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.seatping.biz/search?query={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SeatPing",
        "url": "https://www.seatping.biz",
        "logo": "https://www.seatping.biz/display.jpeg",
        "description": "SeatPing helps customers discover restaurants, book tables, and join queues, while helping businesses manage reservations, waitlists, and customer flow."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
